<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de PoS OXXO</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/modal.css">
    <script src="./js/functions.js" defer></script>
    <script src="./js/modal.js" defer></script>
</head>

<body>
<header class="encabezado">
    <!-- IMG ARRIBA IZQUIERDA -->
    <img src="./img/oxxo.webp" class="logo1" alt="Logo OXXO">

    <!-- TITULO PRINCIPAL -->
    <div class="contenido">
        <h1 class="titulo">OXXO Siempre Cerca de Ti</h1>
        <h2 class="subtitulo">No es Bueno pero es Barato</h2>
    </div>

    <!-- IMG ARRIBA DERECHA -->
    <img src="./img/Spin.png" class="logo2" alt="Tarjeta Spin">
</header>

<!-- AREA PRODUCTOS -->
<div class="contenedor">
    <table id="carrito">
        <thead>
            <tr>
                <th class="titulocantidad">Cantidad</th>
                <th>Producto</th>
                <th>Precio</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody id="cuerpo"></tbody>
    </table>
</div>

<!-- Unico Input -->
<input type="text" id="codigodelproducto" class="claseinput"
       placeholder="Ingresar SKU de Producto (ej. 001 o 3*001)"
       autocomplete="off" autofocus
       onkeydown="buscarProducto(event)">

<!-- Botones Tipo Oxxo -->
<div class="contenedor2">
    <div class="grupobotones">
        <input type="button" id="button1" class="claseboton" title="Cancelar venta"   aria-label="Cancelar venta"   onclick="cancelarVenta()">
        <input type="button" id="button2" class="claseboton" title="Saldo UNE"        aria-label="Saldo UNE"        onclick="saldoCamion()">
        <input type="button" id="button3" class="claseboton" title="Transferencia"    aria-label="Transferencia"    onclick="transferencia()">
        <input type="button" id="button4" class="claseboton" title="Paquetes de datos" aria-label="Paquetes de datos" onclick="abrirModal()">
        <input type="button" id="button5" class="claseboton" title="Pagar"            aria-label="Pagar"            onclick="pagar()">
    </div>
    <div id="feedback" class="feedback" aria-live="polite"></div>
    <div class="total">
        <h1 id="total">$0.00</h1>
    </div>
</div>

<!-- MODAL DE PAQUETES DE DATOS -->
<div id="modal" class="modal">
    <div class="contenido-modal">
        <h2>Selecciona un Saldo</h2>
        <img src="./img/50MX.png"  alt="Paquete $50"  onclick="agregarPaquete(50)">
        <img src="./img/100MX.png" alt="Paquete $100" onclick="agregarPaquete(100)">
        <img src="./img/200MX.png" alt="Paquete $200" onclick="agregarPaquete(200)">
        <img src="./img/500MX.png" alt="Paquete $500" onclick="agregarPaquete(500)">
        <br><br>
        <button type="button" onclick="cerrarModal()">Cerrar</button>
    </div>
</div>
</body>
</html>
